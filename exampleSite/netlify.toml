[build.environment]
HUGO_VERSION = "0.165.0"
NODE_VERSION = "22.20.0"
# TZ = "Europe/Oslo"
# URL is supplied by Netlify and equals the site's primary domain, so the baseURL
# below follows whatever domain is set as primary. It used to be hardcoded here,
# which meant every absolute URL pointed at one address no matter what served the
# site.

[build]
publish = "public"
command = """\
  tinacms build && \
  git config core.quotepath false && \
  hugo --gc --minify --baseURL "${URL}"
  """
